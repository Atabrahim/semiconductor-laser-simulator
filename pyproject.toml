[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semiconductor-laser-simulator"
version = "0.1.0"
description = "Quantum-well laser physics with explicit approximations and independent validation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12"]
license = {text = "MIT"}

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
